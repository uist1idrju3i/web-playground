name: Dependency Review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # GHSA-wrw7-89jp-8q8g: moderate unsoundness in glib::VariantStrIter.
          # Reached only through tauri-runtime-wry → tao → gtk 0.18; the fix
          # requires gtk-rs 0.20, which Tauri v2 does not use yet (Tauri 3 is
          # alpha). The shell never calls VariantStrIter; revisit when Tauri
          # upgrades its GTK stack.
          allow-ghsas: GHSA-wrw7-89jp-8q8g
