version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/native/electron', '/native/tauri']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch, major]
  - package-ecosystem: cargo
    directory: /native/tauri/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch, major]
  - package-ecosystem: gomod
    directory: /native/wails
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns: ['*']
        update-types: [minor, patch, major]
